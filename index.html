      };

      const KPI_ORDER = [
        ["publications", "doc"],
        ["journals", "journal"],
        ["conferences", "mic"],
        ["firstAuthor", "pen"],
        ["projects", "globe"],
        ["ongoing", "pulse"],

        ["visitors", "eye"]
      ];

      // ------------------------------------------------------------------
      // Rendering
      // ------------------------------------------------------------------

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function externalLink(label, href, className) {
        const a = el("a", className, label);
        a.href = href;
        if (!href.startsWith("mailto:") && !href.startsWith("#")) {
          a.target = "_blank";
          a.rel = "noopener";
        }
        return a;
      }

      function renderNav(data) {
        const nav = document.getElementById("nav");
        nav.replaceChildren(...data.nav.map(([target, label]) => {
          const a = el("a", "", label);
          a.href = `#${target}`;
          a.dataset.target = target;
          return a;
        }));
      }

        document.getElementById(id).replaceChildren(...items.map(([label, href, icon]) => {
          const a = externalLink("", href, "social-link");
          a.setAttribute("aria-label", label);
          a.title = label;
          a.innerHTML = ICONS[icon];
          return a;
        }));

      function renderKpis(data) {
        const grid = document.getElementById("kpi-grid");
        grid.replaceChildren(...KPI_ORDER
          .filter(([key]) => key !== "visitors" || GOATCOUNTER_CODE)
          .map(([key, icon, suffix], i) => {
            const card = el("article", "kpi glass spot");
            card.dataset.reveal = "";
            card.style.setProperty("--i", i % 4);
            const ic = el("span", "kpi-icon");
            ic.innerHTML = ICONS[icon];
            const value = el("strong", "kpi-value");
            const num = el("span", "", stats[key] === null ? "–" : "0");
            num.dataset.count = key;
            value.append(num);
            if (suffix) value.append(suffix);
            card.append(ic, value, el("span", "kpi-label", data.kpis[key]));
            return card;
          }));

      // Google Scholar panel: citations, h-index, i10-index and a per-year chart.
      function renderScholar(data, lang) {
        const sch = window.CV_SCHOLAR;
        const panel = document.getElementById("scholar-panel");
        if (!sch) { panel.hidden = true; return; }
        panel.hidden = false;
        const L = data.scholar;

        document.getElementById("scholar-stats").replaceChildren(...[
          ["citations", sch.citationsRecent],
          ["hIndex", sch.hIndexRecent],
          ["i10Index", sch.i10IndexRecent]
        ].map(([key, recent]) => {
          const block = el("div", "scholar-stat");
          const num = el("strong", "", "0");
          num.dataset.count = key;
          block.append(num, el("span", "scholar-label", L[key]));
          if (sch.recentSince) {
            block.append(el("span", "scholar-since", L.since.replace("{year}", sch.recentSince).replace("{n}", recent)));
          }
          return block;
        }));

        setText("scholar-chart-title", L.perYear);
        const max = Math.max(1, ...sch.citationsPerYear.map((d) => d.count));
        document.getElementById("scholar-bars").replaceChildren(...sch.citationsPerYear.map((d, i) => {
          const bar = el("div", "bar");
          bar.style.setProperty("--h", `${Math.max(3, (d.count / max) * 100)}%`);
          bar.style.setProperty("--i", i);
          const col = el("span", "bar-fill");
          col.append(el("span", "bar-value", String(d.count)));
          bar.append(col, el("span", "bar-year", String(d.year)));
          bar.title = `${d.year}: ${d.count}`;
          return bar;

        const date = new Date(sch.updated + "T12:00:00").toLocaleDateString(lang === "el" ? "el-GR" : "en-GB",

      function timelineItem(date, title, org, details, i) {
        const li = el("li", "timeline-item");

      function renderSkills(data) {

        setText("float-projects", data.float.projects);

        setText("numbers-title", data.numbersTitle);
        setText("about-label", data.aboutLabel);
        setText("about-title", data.aboutTitle);

        setText("experience-label", data.experienceLabel);

        setText("projects-title", data.projectsTitle);
        setText("projects-intro", data.projectsIntro);
        setText("publications-label", data.publicationsLabel);
        setText("publications-title", data.publicationsTitle);
        setText("publications-intro", data.publicationsIntro + " ");
        document.getElementById("scholar-link").href = links.scholar;
        setText("skills-label", data.skillsLabel);
        setText("skills-title", data.skillsTitle);
        setText("credentials-label", data.credentialsLabel);
        setText("credentials-title", data.credentialsTitle);

        setText("certifications-column", data.certificationsColumn);

        setText("footer-text", data.footer.replace("{year}", today.getFullYear()));
        updateVisits();

        document.querySelectorAll(".lang-button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === lang);

      }

      // ------------------------------------------------------------------
      // Motion
      // ------------------------------------------------------------------

      // Reveal elements as they scroll into view, then count numbers up.
      const counted = new WeakSet();
      const revealObserver = "IntersectionObserver" in window
        ? new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add("is-visible");
              entry.target.querySelectorAll("[data-count]").forEach(countUp);
              revealObserver.unobserve(entry.target);
            });
          }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" })
        : null;

      function observeReveals() {
        document.querySelectorAll("[data-reveal]:not(.is-visible)").forEach((node) => {
          if (revealObserver && !prefersReducedMotion) revealObserver.observe(node);
          else {
            node.classList.add("is-visible");
            node.querySelectorAll("[data-count]").forEach(countUp);
          }
        });
        // The hero cards are inside an already-visible block on language switch.
        document.querySelectorAll(".is-visible [data-count]").forEach(countUp);
      }

      function countUp(node) {
        const target = stats[node.dataset.count];
        if (target === null || target === undefined) return;
        if (counted.has(node) && node.dataset.done === String(target)) {
          node.textContent = target.toLocaleString();
          return;
        }
        counted.add(node);
        node.dataset.done = String(target);
        if (prefersReducedMotion) {
          node.textContent = target.toLocaleString();
          return;
        }
        const duration = 1600;
        const start = performance.now();
        const step = (now) => {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          node.textContent = Math.round(target * eased).toLocaleString();
          if (t < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      // Typewriter effect for the role line.
      let typeTimer = null;
      function typeRoles(roles) {
        const target = document.getElementById("hero-role");
        clearTimeout(typeTimer);
        if (prefersReducedMotion) {
          target.textContent = roles[0];
          return;
        }
        let roleIndex = 0, charIndex = 0, deleting = false;
        const tick = () => {
          const word = roles[roleIndex];
          charIndex += deleting ? -1 : 1;
          target.textContent = word.slice(0, charIndex);
          let delay = deleting ? 35 : 70;
          if (!deleting && charIndex === word.length) { deleting = true; delay = 1800; }
          else if (deleting && charIndex === 0) { deleting = false; roleIndex = (roleIndex + 1) % roles.length; delay = 350; }
          typeTimer = setTimeout(tick, delay);
        };
        tick();
      }

      // Cards light up where the pointer is; project cards tilt slightly.
      function bindSpotlights() {
        document.querySelectorAll(".spot:not([data-bound])").forEach((card) => {
          card.dataset.bound = "";
          card.addEventListener("pointermove", (e) => {
            const r = card.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            card.style.setProperty("--mx", `${x}px`);
            card.style.setProperty("--my", `${y}px`);
            if (card.classList.contains("tilt") && !prefersReducedMotion) {
              const rx = ((y / r.height) - 0.5) * -6;
              const ry = ((x / r.width) - 0.5) * 6;
              card.style.setProperty("--rx", `${rx}deg`);
              card.style.setProperty("--ry", `${ry}deg`);
            }
          });
          card.addEventListener("pointerleave", () => {
            card.style.setProperty("--rx", "0deg");
            card.style.setProperty("--ry", "0deg");
          });
        });
      }

      // Hero parallax: floating cards drift with the pointer.
      const heroVisual = document.getElementById("hero-visual");
      if (!prefersReducedMotion) {
        heroVisual.addEventListener("pointermove", (e) => {
          const r = heroVisual.getBoundingClientRect();
          const dx = (e.clientX - r.left) / r.width - 0.5;
          const dy = (e.clientY - r.top) / r.height - 0.5;
          heroVisual.querySelectorAll("[data-depth]").forEach((card) => {
            const d = Number(card.dataset.depth);
            card.style.setProperty("--px", `${dx * d}px`);
            card.style.setProperty("--py", `${dy * d}px`);
          });
        });
        heroVisual.addEventListener("pointerleave", () => {
          heroVisual.querySelectorAll("[data-depth]").forEach((card) => {
            card.style.setProperty("--px", "0px");
            card.style.setProperty("--py", "0px");
          });
        });
      }

      // Header style, scroll progress bar and active nav link.
      const header = document.getElementById("site-header");
      const progress = document.getElementById("scroll-progress");
      function onScroll() {
        const max = document.documentElement.scrollHeight - innerHeight;
        progress.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
        header.classList.toggle("scrolled", scrollY > 20);
        let active = "";
        document.querySelectorAll("main section[id]").forEach((s) => {
          if (s.getBoundingClientRect().top < innerHeight * 0.35) active = s.id;
        });
        document.querySelectorAll("#nav a").forEach((a) => {
          a.classList.toggle("active", a.dataset.target === active);
        });
      }
      addEventListener("scroll", onScroll, { passive: true });

      // Mobile menu.
      const menuButton = document.getElementById("menu-toggle");
      menuButton.addEventListener("click", () => {
        const open = header.classList.toggle("nav-open");
        menuButton.setAttribute("aria-expanded", String(open));
      });
      document.getElementById("nav").addEventListener("click", (e) => {
        if (e.target.closest("a")) {
          header.classList.remove("nav-open");
          menuButton.setAttribute("aria-expanded", "false");
        }
      });

      // Theme toggle (dark / light), remembered per visitor.
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        network.recolor();
      });

      // Animated network background (nodes and links, reacting to the pointer).
      const network = (() => {
        const canvas = document.getElementById("bg-network");
        const ctx = canvas.getContext("2d");
        let w = 0, h = 0, dpr = 1, nodes = [], color = "139, 92, 246", running = true;
        const pointer = { x: -9999, y: -9999 };

        function recolor() {
          const v = getComputedStyle(document.documentElement).getPropertyValue("--network-rgb").trim();
          if (v) color = v;
          if (prefersReducedMotion) draw();
        }

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.width = innerWidth * dpr;
          h = canvas.height = innerHeight * dpr;
          canvas.style.width = innerWidth + "px";
          canvas.style.height = innerHeight + "px";
          const count = Math.round(Math.min(90, (innerWidth * innerHeight) / 16000));
          nodes = Array.from({ length: count }, () => ({
            x: Math.random() * w, y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.25 * dpr, vy: (Math.random() - 0.5) * 0.25 * dpr,
            r: (Math.random() * 1.4 + 0.6) * dpr
          }));
          if (prefersReducedMotion) draw();
        }

        function draw() {
          ctx.clearRect(0, 0, w, h);
          const linkDist = 140 * dpr;
          for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            for (let j = i + 1; j < nodes.length; j++) {
              const b = nodes[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              const d = Math.hypot(dx, dy);
              if (d < linkDist) {
                ctx.strokeStyle = `rgba(${color}, ${0.16 * (1 - d / linkDist)})`;
                ctx.lineWidth = dpr * 0.8;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
              }
            }
            const pd = Math.hypot(a.x - pointer.x, a.y - pointer.y);
            if (pd < 180 * dpr) {
              ctx.strokeStyle = `rgba(${color}, ${0.35 * (1 - pd / (180 * dpr))})`;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
            }
            ctx.fillStyle = `rgba(${color}, 0.55)`;
            ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
          }
        }

        function loop() {
          if (!running) return;
          for (const n of nodes) {
            n.x += n.vx; n.y += n.vy;
            if (n.x < 0 || n.x > w) n.vx *= -1;
            if (n.y < 0 || n.y > h) n.vy *= -1;
          }
          draw();
          requestAnimationFrame(loop);
        }

        addEventListener("resize", resize);
        addEventListener("pointermove", (e) => { pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; }, { passive: true });
        document.addEventListener("visibilitychange", () => {
          running = !document.hidden && !prefersReducedMotion;
          if (running) loop();
        });
        recolor();
        resize();
        if (prefersReducedMotion) { running = false; draw(); } else loop();
        return { recolor };
      })();

      // ------------------------------------------------------------------
      // Visitor counter (GoatCounter, optional)
      // ------------------------------------------------------------------

      let currentLang = "en";
      function updateVisits() {
        const node = document.getElementById("footer-visits");
        if (stats.visitors === null) { node.hidden = true; return; }
        node.hidden = false;
        node.textContent = content[currentLang].visits.replace("{n}", stats.visitors.toLocaleString());
      }

      if (GOATCOUNTER_CODE) {
        const endpoint = `https://${GOATCOUNTER_CODE}.goatcounter.com`;
        const script = document.createElement("script");
        script.async = true;
        script.src = "https://gc.zgo.at/count.js";
        script.dataset.goatcounter = `${endpoint}/count`;
        document.head.append(script);
        fetch(`${endpoint}/counter/TOTAL.json`)
          .then((r) => (r.ok ? r.json() : null))
          .then((json) => {
            if (!json) return;
            stats.visitors = Number(String(json.count).replace(/[^\d]/g, "")) || 0;
            document.querySelectorAll('[data-count="visitors"]').forEach((n) => {
              counted.delete(n);
              if (n.closest(".is-visible")) countUp(n);
            });
            updateVisits();
          })
          .catch(() => {});
      }

      // ------------------------------------------------------------------
      // Start
      // ------------------------------------------------------------------

      renderSocial("social-links");
      document.querySelectorAll(".lang-button").forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });
      let startLang = "en";
      try { if (localStorage.getItem("lang") === "el") startLang = "el"; } catch (e) {}
      setLanguage(startLang);
      onScroll();
    </script>
  </body>
</html>
