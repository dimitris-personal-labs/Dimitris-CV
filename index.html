<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Dimitrios Christos Asimopoulos - AI Engineer and Electrical Engineer portfolio."
    />
    <title>Dimitrios Christos Asimopoulos | AI Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Home">DCA</a>
      <nav class="nav" id="nav" aria-label="Primary navigation"></nav>
      <div class="language-switcher" aria-label="Language switcher">
        <button class="lang-button active" type="button" data-lang="en">EN</button>
        <button class="lang-button" type="button" data-lang="el">EL</button>
      </div>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow" id="hero-label"></p>
          <h1>Dimitrios Christos Asimopoulos</h1>
          <p class="headline" id="hero-text"></p>
          <div class="hero-actions">
            <a class="button primary" id="contact-action" href="#contact"></a>
            <a class="button secondary" id="cv-action" href="#"></a>
          </div>
          <div class="impact-strip" id="impact-strip" aria-label="Career highlights"></div>
        </div>

        <aside class="profile-panel" aria-label="Profile summary">
          <img
            class="profile-photo"
            src="assets/dimitrios-asimopoulos-photo.jpg"
            alt="Dimitrios Christos Asimopoulos"
          />
          <div class="profile-card">
            <p class="profile-name">Dimitrios Christos Asimopoulos</p>
            <dl id="profile-list"></dl>
          </div>
        </aside>
      </section>

      <section class="section intro-section" id="profile">
        <div class="section-kicker">01</div>
        <div class="section-heading">
          <p class="section-label" id="profile-label"></p>
          <h2 id="profile-title"></h2>
        </div>
        <div class="section-body">
          <p id="profile-text"></p>
        </div>
      </section>

      <section class="section" id="experience">
        <div class="section-kicker">02</div>
        <div class="section-heading">
          <p class="section-label" id="experience-label"></p>
          <h2 id="experience-title"></h2>
        </div>
        <div id="experience-content"></div>
      </section>

      <section class="section" id="education">
        <div class="section-kicker">03</div>
        <div class="section-heading">
          <p class="section-label" id="education-label"></p>
          <h2 id="education-title"></h2>
        </div>
        <div class="stack-list" id="education-content"></div>
      </section>

      <section class="section" id="certifications">
        <div class="section-kicker">04</div>
        <div class="section-heading">
          <p class="section-label" id="certifications-label"></p>
          <h2 id="certifications-title"></h2>
        </div>
        <div class="stack-list compact" id="certifications-content"></div>
      </section>

      <section class="section" id="languages">
        <div class="section-kicker">05</div>
        <div class="section-heading">
          <p class="section-label" id="languages-label"></p>
          <h2 id="languages-title"></h2>
        </div>
        <div id="languages-content"></div>
      </section>

      <section class="section" id="digital-skills">
        <div class="section-kicker">06</div>
        <div class="section-heading">
          <p class="section-label" id="skills-label"></p>
          <h2 id="skills-title"></h2>
        </div>
        <div class="skill-groups" id="skills-content"></div>
      </section>

      <section class="section" id="projects">
        <div class="section-kicker">07</div>
        <div class="section-heading">
          <p class="section-label" id="projects-label"></p>
          <h2 id="projects-title"></h2>
          <p class="section-intro" id="projects-intro"></p>
        </div>
        <div class="project-grid" id="projects-content"></div>
      </section>

      <section class="section" id="publications">
        <div class="section-kicker">08</div>
        <div class="section-heading">
          <p class="section-label" id="publications-label"></p>
          <h2 id="publications-title"></h2>
          <p class="section-intro" id="publications-intro"></p>
        </div>
        <ol class="publication-list" id="publications-content"></ol>
      </section>

      <section class="contact-section" id="contact">
        <p class="section-label" id="contact-label"></p>
        <h2 id="contact-title"></h2>
        <p id="contact-text"></p>
        <div class="contact-links" id="contact-links"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p id="footer-text"></p>
    </footer>

    <script src="data/publications.js"></script>
    <script src="data/projects.js"></script>
    <script src="data/profile.js"></script>
    <script>
      const links = {
        email: "mailto:dasimopoulos@metamind.gr",
        linkedIn: "https://www.linkedin.com/in/dimitris-christos-asimopoulos-2a627a262/",
        scholar: "https://scholar.google.com/citations?user=HO6cbW8AAAAJ&hl=el",
        orcid: "https://orcid.org/0009-0009-6439-0857",
        cvEn: "assets/dimitrios-asimopoulos-cv-en.pdf",
        cvEl: "assets/dimitrios-asimopoulos-cv-el.pdf"
      };


      const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
        "August", "September", "October", "November", "December"];

      // Your name as it appears in author lists; matches are shown in bold.
      const OWN_NAME = /D\. (?:C\. )?Asimopoulos/g;

      // Newest first: by year, then by month (entries without a month go last within their year).
      const sortedPublications = [...window.CV_PUBLICATIONS].sort((a, b) =>
        b.year - a.year || MONTHS.indexOf(b.month) - MONTHS.indexOf(a.month)
      );

      const peerReviewedCount = window.CV_PUBLICATIONS.filter((pub) => pub.type !== "preprint").length;
      const projectCount = window.CV_PROJECTS.length;

      function publicationDetails(pub) {
        const parts = [pub.venue];
        if (pub.pages) parts.push(pub.pages);
        parts.push(pub.month ? `${pub.month} ${pub.year}` : String(pub.year));
        if (pub.doi) parts.push(`doi: ${pub.doi}`);
        return parts.join(", ");
      }

      function publicationLink(pub) {
        if (pub.doi) return `https://doi.org/${pub.doi}`;
        return pub.url || "";
      }

      // "MM/YYYY" -> number that sorts by date, e.g. "09/2024" -> 202409.
      function monthValue(mmYYYY) {
        const [month, year] = mmYYYY.split("/").map(Number);
        return year * 100 + month;
      }

      const today = new Date();
      const currentMonth = today.getFullYear() * 100 + today.getMonth() + 1;

      // Oldest first, by start date.
      const sortedProjects = [...window.CV_PROJECTS].sort(
        (a, b) => monthValue(a.start) - monthValue(b.start)
      );

      function projectDates(project, ongoingLabel) {
        if (!project.end) return `${project.start} - ${ongoingLabel}`;
        const ongoing = monthValue(project.end) >= currentMonth;
        return `${project.start} - ${project.end}${ongoing ? ` (${ongoingLabel.toLowerCase()})` : ""}`;
      }

      function projectsFor(lang, ongoingLabel) {
        return sortedProjects.map((project) => [
          project.name,
          projectDates(project, ongoingLabel),
          project.description[lang],
          project.programme || "",
          project.url || ""
        ]);
      }

      const content = {
        en: {
          pageTitle: "Dimitrios Christos Asimopoulos | AI Engineer",
          nav: [
            ["experience", "Work Experience"],
            ["education", "Education"],
            ["certifications", "Certifications"],
            ["languages", "Languages"],
            ["digital-skills", "Digital Skills"],
            ["projects", "Projects"],
            ["publications", "Publications"],
            ["contact", "Contact"]
          ],
          heroLabel: "AI Researcher / Electrical Engineer",
          heroText: "Ph.D. candidate and AI researcher working on AI in IoT systems, cybersecurity, privacy, ethical challenges and solutions.",
          contactAction: "Contact",
          cvAction: "Download CV",
          cvHref: links.cvEn,
          impacts: [
            ["2022", "R&D since"],
            [String(projectCount), "EU research projects"],
            [String(peerReviewedCount), "peer-reviewed publications"]
          ],
          profileLabel: "Profile",
          profileTitle: "Professional summary",
          ...window.CV_PROFILE.en,
          profileFacts: [
            ["Role", "AI Researcher / Electrical Engineer"],
            ["Location", "Thessaloniki, Greece"],
            ["Email", "dasimopoulos@metamind.gr", links.email],
            ["LinkedIn", "Profile", links.linkedIn],
            ["Google Scholar", "Citations", links.scholar],
            ["ORCID", "0009-0009-6439-0857", links.orcid]
          ],
          sections: {
            experience: ["Work Experience", "Professional experience"],
            education: ["Education and Training", "Academic background"],
            certifications: ["Certifications", "Additional training certifications"],
            languages: ["Language Skills", "Languages"],
            skills: ["Digital Skills", "Technical toolkit"],
            projects: ["Projects", "EU-funded research projects"],
            publications: ["Publications", "Selected peer-reviewed publications"],
            contact: ["Contact", "Let’s connect"]
          },
          projectsIntro: "EU-funded research projects (Horizon 2020, Horizon Europe and Digital Europe) through MetaMind Innovations P.C.",
          projects: projectsFor("en", "Ongoing"),
          publicationsIntro: "Full list available on Google Scholar.",
          publications: sortedPublications,
          contactText: "Available for research collaborations, AI engineering opportunities and technical discussions around cybersecurity, adversarial machine learning and critical infrastructure protection.",
          contactLinks: [
            ["Email", "dasimopoulos@metamind.gr", links.email],
            ["LinkedIn", "LinkedIn", links.linkedIn],
            ["Google Scholar", "Google Scholar", links.scholar],
            ["ORCID", "ORCID", links.orcid]
          ],
          footer: "© {year} Dimitrios Christos Asimopoulos. All rights reserved."
        },
        el: {
          pageTitle: "Δημήτριος Χρήστος Ασημόπουλος | Μηχανικός Τεχνητής Νοημοσύνης",
          nav: [
            ["experience", "Επαγγελματική Εμπειρία"],
            ["education", "Εκπαίδευση"],
            ["certifications", "Πιστοποιήσεις"],
            ["languages", "Γλώσσες"],
            ["digital-skills", "Ψηφιακές Δεξιότητες"],
            ["projects", "Έργα"],
            ["publications", "Δημοσιεύσεις"],
            ["contact", "Επικοινωνία"]
          ],
          heroLabel: "Ερευνητής Τεχνητής Νοημοσύνης / Ηλεκτρολόγος Μηχανικός",
          heroText: "Υποψήφιος διδάκτορας και ερευνητής Τεχνητής Νοημοσύνης με αντικείμενο την AI σε συστήματα IoT, την ασφάλεια, την ιδιωτικότητα, τις ηθικές προκλήσεις και τις αντίστοιχες λύσεις.",
          contactAction: "Επικοινωνία",
          cvAction: "Λήψη βιογραφικού",
          cvHref: links.cvEl,
          impacts: [
            ["2022", "Έρευνα και ανάπτυξη από"],
            [String(projectCount), "ευρωπαϊκά ερευνητικά έργα"],
            [String(peerReviewedCount), "δημοσιεύσεις με κρίση"]
          ],
          profileLabel: "Προφίλ",
          profileTitle: "Επαγγελματική περίληψη",
          ...window.CV_PROFILE.el,
          profileFacts: [
            ["Ρόλος", "Ερευνητής Τεχνητής Νοημοσύνης / Ηλεκτρολόγος Μηχανικός"],
            ["Τοποθεσία", "Θεσσαλονίκη, Ελλάδα"],
            ["Email", "dasimopoulos@metamind.gr", links.email],
            ["LinkedIn", "Προφίλ", links.linkedIn],
            ["Google Scholar", "Δημοσιεύσεις", links.scholar],
            ["ORCID", "0009-0009-6439-0857", links.orcid]
          ],
          sections: {
            experience: ["Επαγγελματική Εμπειρία", "Επαγγελματική πορεία"],
            education: ["Εκπαίδευση και Κατάρτιση", "Ακαδημαϊκό υπόβαθρο"],
            certifications: ["Πιστοποιήσεις", "Πρόσθετες πιστοποιήσεις κατάρτισης"],
            languages: ["Γλωσσικές Δεξιότητες", "Γλώσσες"],
            skills: ["Ψηφιακές Δεξιότητες", "Τεχνικό υπόβαθρο"],
            projects: ["Έργα", "Ευρωπαϊκά ερευνητικά έργα"],
            publications: ["Δημοσιεύσεις", "Επιλεγμένες δημοσιεύσεις με κρίση"],
            contact: ["Επικοινωνία", "Ας συνδεθούμε"]
          },
          projectsIntro: "Ευρωπαϊκά ερευνητικά έργα (Horizon 2020, Horizon Europe και Digital Europe) μέσω της MetaMind Innovations P.C.",
          projects: projectsFor("el", "Σε εξέλιξη"),
          publicationsIntro: "Πλήρης λίστα διαθέσιμη στο Google Scholar.",
          publications: sortedPublications,
          contactText: "Διαθέσιμος για ερευνητικές συνεργασίες, ευκαιρίες AI engineering και τεχνικές συζητήσεις γύρω από κυβερνοασφάλεια, ανταγωνιστική μηχανική μάθηση και προστασία κρίσιμων υποδομών.",
          contactLinks: [
            ["Email", "dasimopoulos@metamind.gr", links.email],
            ["LinkedIn", "LinkedIn", links.linkedIn],
            ["Google Scholar", "Google Scholar", links.scholar],
            ["ORCID", "ORCID", links.orcid]
          ],
          footer: "© {year} Δημήτριος Χρήστος Ασημόπουλος. Με επιφύλαξη παντός δικαιώματος."
        }
      };

      function clear(node) {
        node.replaceChildren();
      }

      function link(label, href) {
        const anchor = document.createElement("a");
        anchor.textContent = label;
        anchor.href = href;
        return anchor;
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function renderNav(data) {
        const nav = document.getElementById("nav");
        clear(nav);
        data.nav.forEach(([target, label]) => {
          nav.appendChild(link(label, `#${target}`));
        });
      }

      function renderProfile(data) {
        const list = document.getElementById("profile-list");
        clear(list);
        data.profileFacts.forEach(([label, value, href]) => {
          const wrapper = document.createElement("div");
          const dt = document.createElement("dt");
          const dd = document.createElement("dd");
          dt.textContent = label;
          if (href) {
            dd.appendChild(link(value, href));
          } else {
            dd.textContent = value;
          }
          wrapper.append(dt, dd);
          list.appendChild(wrapper);
        });
      }

      function renderImpacts(data) {
        const strip = document.getElementById("impact-strip");
        clear(strip);
        data.impacts.forEach(([number, label]) => {
          const item = document.createElement("div");
          item.innerHTML = `<strong>${number}</strong><span>${label}</span>`;
          strip.appendChild(item);
        });
      }

      function renderExperience(data) {
        const container = document.getElementById("experience-content");
        clear(container);
        const article = document.createElement("article");
        article.className = "timeline-item featured";
        article.innerHTML = `
          <div class="timeline-date">${data.experience.date}<span>${data.experience.location}</span></div>
          <div>
            <h3>${data.experience.title}</h3>
            <p class="meta">${data.experience.company}</p>
            <ul class="feature-list"></ul>
          </div>
        `;
        const list = article.querySelector("ul");
        data.experience.bullets.forEach((text) => {
          const li = document.createElement("li");
          li.textContent = text;
          list.appendChild(li);
        });
        container.appendChild(article);
      }

      function renderStack(id, items) {
        const container = document.getElementById(id);
        clear(container);
        items.forEach((item) => {
          const article = document.createElement("article");
          article.className = "stack-item";
          if (Array.isArray(item)) {
            article.innerHTML = `<h3>${item[0]}</h3><p>${item[1]}</p>`;
          } else {
            article.innerHTML = `
              <p class="meta">${item.date} · ${item.location}</p>
              <h3>${item.title}</h3>
              <p class="org">${item.org}</p>
              <p>${item.body}</p>
            `;
          }
          container.appendChild(article);
        });
      }

      function renderLanguages(data) {
        const container = document.getElementById("languages-content");
        clear(container);
        const mother = document.createElement("p");
        mother.className = "mother-tongue";
        mother.textContent = data.languages.motherTongue;
        const table = document.createElement("table");
        table.className = "language-table";
        const thead = document.createElement("thead");
        thead.innerHTML = `<tr>${data.languages.headers.map((h) => `<th>${h}</th>`).join("")}</tr>`;
        const tbody = document.createElement("tbody");
        data.languages.rows.forEach((row) => {
          tbody.innerHTML += `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`;
        });
        table.append(thead, tbody);
        container.append(mother, table);
      }

      function renderSkills(data) {
        const container = document.getElementById("skills-content");
        clear(container);
        data.skillGroups.forEach(([title, skills]) => {
          const group = document.createElement("article");
          group.className = "skill-group";
          group.innerHTML = `<h3>${title}</h3><div class="skills"></div>`;
          const skillList = group.querySelector(".skills");
          skills.forEach((skill) => {
            const span = document.createElement("span");
            span.textContent = skill;
            skillList.appendChild(span);
          });
          container.appendChild(group);
        });
      }

      function renderProjects(data) {
        const container = document.getElementById("projects-content");
        clear(container);
        data.projects.forEach(([title, date, body, programme, url]) => {
          const article = document.createElement("article");
          article.className = "project-card";

          const meta = document.createElement("p");
          meta.className = "meta";
          meta.textContent = programme ? `${date} · ${programme}` : date;

          const heading = document.createElement("h3");
          if (url) {
            const a = document.createElement("a");
            a.href = url;
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = title;
            heading.append(a);
          } else {
            heading.textContent = title;
          }

          const description = document.createElement("p");
          description.textContent = body;

          article.append(meta, heading, description);
          container.appendChild(article);
        });
      }

      function renderPublications(data) {
        const container = document.getElementById("publications-content");
        clear(container);
        data.publications.forEach((pub) => {
          const li = document.createElement("li");

          // Authors, with your own name in bold.
          let last = 0;
          for (const match of pub.authors.matchAll(OWN_NAME)) {
            li.append(pub.authors.slice(last, match.index));
            const strong = document.createElement("strong");
            strong.textContent = match[0];
            li.append(strong);
            last = match.index + match[0].length;
          }
          li.append(pub.authors.slice(last), ", “");

          // Title, linked to the DOI (or url) when there is one.
          const href = publicationLink(pub);
          if (href) {
            const a = document.createElement("a");
            a.href = href;
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = pub.title;
            li.append(a);
          } else {
            li.append(pub.title);
          }

          li.append(`”, ${publicationDetails(pub)}.`);
          container.appendChild(li);
        });
      }

      function renderContact(data) {
        const container = document.getElementById("contact-links");
        clear(container);
        data.contactLinks.forEach(([aria, label, href]) => {
          const anchor = link(label, href);
          anchor.setAttribute("aria-label", aria);
          container.appendChild(anchor);
        });
      }

      function setLanguage(lang) {
        const data = content[lang];
        document.documentElement.lang = lang;
        document.title = data.pageTitle;

        renderNav(data);
        renderProfile(data);
        renderImpacts(data);

        setText("hero-label", data.heroLabel);
        setText("hero-text", data.heroText);
        setText("contact-action", data.contactAction);
        setText("profile-label", data.profileLabel);
        setText("profile-title", data.profileTitle);
        setText("profile-text", data.profileText);

        const cvAction = document.getElementById("cv-action");
        cvAction.textContent = data.cvAction;
        cvAction.href = data.cvHref;

        setText("experience-label", data.sections.experience[0]);
        setText("experience-title", data.sections.experience[1]);
        setText("education-label", data.sections.education[0]);
        setText("education-title", data.sections.education[1]);
        setText("certifications-label", data.sections.certifications[0]);
        setText("certifications-title", data.sections.certifications[1]);
        setText("languages-label", data.sections.languages[0]);
        setText("languages-title", data.sections.languages[1]);
        setText("skills-label", data.sections.skills[0]);
        setText("skills-title", data.sections.skills[1]);
        setText("projects-label", data.sections.projects[0]);
        setText("projects-title", data.sections.projects[1]);
        setText("projects-intro", data.projectsIntro);
        setText("publications-label", data.sections.publications[0]);
        setText("publications-title", data.sections.publications[1]);
        setText("publications-intro", data.publicationsIntro);
        setText("contact-label", data.sections.contact[0]);
        setText("contact-title", data.sections.contact[1]);
        setText("contact-text", data.contactText);
        setText("footer-text", data.footer.replace("{year}", new Date().getFullYear()));

        renderExperience(data);
        renderStack("education-content", data.education);
        renderStack("certifications-content", data.certifications);
        renderLanguages(data);
        renderSkills(data);
        renderProjects(data);
        renderPublications(data);
        renderContact(data);

        document.querySelectorAll(".lang-button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === lang);
        });
      }

      document.querySelectorAll(".lang-button").forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });

      setLanguage("en");
    </script>
  </body>
</html>
